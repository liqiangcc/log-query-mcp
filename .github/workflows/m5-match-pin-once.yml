name: M5 Match Pin Once

on:
  push:
    branches:
      - "feat/v2-m1-backend-config"
    paths:
      - ".github/workflows/m5-match-pin-once.yml"
      - ".github/scripts/m5_clippy_box_patch.py"
      - ".github/scripts/m5_match_pin_patch.py"

permissions:
  contents: write

jobs:
  implement:
    if: github.ref == 'refs/heads/feat/v2-m1-backend-config'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-m1-backend-config

      - name: Apply and verify match generation pinning
        run: |
          python .github/scripts/m5_clippy_box_patch.py
          python .github/scripts/m5_match_pin_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          git diff --check
          CHANGED=$(git diff --name-only | grep -Ev '^(src/backend/mod.rs|src/backend/remote.rs|src/source_registry.rs|src/query_state.rs|src/stateful_query.rs|src/stateful_context.rs)$' || true)
          test -z "$CHANGED"

      - name: Commit verified match generation pinning
        run: |
          git add -- src/backend/mod.rs src/backend/remote.rs src/source_registry.rs src/query_state.rs src/stateful_query.rs src/stateful_context.rs
          CHANGED=$(git diff --cached --name-only | grep -Ev '^(src/backend/mod.rs|src/backend/remote.rs|src/source_registry.rs|src/query_state.rs|src/stateful_query.rs|src/stateful_context.rs)$' || true)
          test -z "$CHANGED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(remote): pin cache generation for match references'
          git push origin HEAD:feat/v2-m1-backend-config
