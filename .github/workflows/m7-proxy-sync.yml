name: M7 Proxy Sync

on:
  push:
    branches:
      - "feat/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/cache/**"
      - "src/config_v2.rs"
      - "src/transport/**"
      - "tests/m7_proxy_sync_live.rs"
      - ".github/workflows/m7-proxy-sync.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/cache/**"
      - "src/config_v2.rs"
      - "src/transport/**"
      - "tests/m7_proxy_sync_live.rs"
      - ".github/workflows/m7-proxy-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-sync-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenSSH and stdio proxy helper
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd
          sudo mkdir -p /run/sshd /tmp/log-query-mcp-m7-sync
          sudo chown "$USER":"$(id -gn)" /tmp/log-query-mcp-m7-sync
          test -x /usr/bin/nc

      - name: Prepare ProxyCommand sync fixture
        run: |
          sudo useradd -m -s /bin/bash logreader
          echo 'logreader:test-password' | sudo chpasswd
          sudo mkdir -p /home/logreader/logs
          printf 'seed\n' | sudo tee /home/logreader/logs/sync-full.log >/dev/null
          printf 'seed\n' | sudo tee /home/logreader/logs/sync-tail.log >/dev/null
          printf 'seed\n' | sudo tee /home/logreader/logs/sync-from-now.log >/dev/null
          printf 'seed\n' | sudo tee /home/logreader/logs/sync-truncate.log >/dev/null
          printf 'seed\n' | sudo tee /home/logreader/logs/sync-rotate.log >/dev/null
          sudo chown -R logreader:logreader /home/logreader/logs
          sudo chmod 777 /home/logreader/logs
          sudo chmod 666 /home/logreader/logs/sync-*.log

          sudo ssh-keygen -q -t ed25519 -N '' -f /tmp/log-query-mcp-m7-sync/ssh_host_ed25519_key
          sudo tee /tmp/log-query-mcp-m7-sync/sshd_config >/dev/null <<'EOF'
          Port 2240
          ListenAddress 127.0.0.1
          HostKey /tmp/log-query-mcp-m7-sync/ssh_host_ed25519_key
          PidFile /tmp/log-query-mcp-m7-sync/sshd.pid
          PasswordAuthentication yes
          PubkeyAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM no
          PermitRootLogin no
          StrictModes yes
          AllowUsers logreader
          Subsystem sftp internal-sftp
          LogLevel VERBOSE
          EOF

          sudo /usr/sbin/sshd -f /tmp/log-query-mcp-m7-sync/sshd_config -E /tmp/log-query-mcp-m7-sync/sshd.log
          ssh-keyscan -t ed25519 -p 2240 127.0.0.1 > /tmp/log-query-mcp-m7-sync/known_hosts

      - name: Check M7 Proxy sync code
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features

      - name: Verify full tail from-now append truncate and rotation through ProxyCommand
        env:
          M7_SYNC_SSH_PORT: "2240"
          M7_SYNC_SSH_PASSWORD: test-password
          M7_SYNC_KNOWN_HOSTS: /tmp/log-query-mcp-m7-sync/known_hosts
          M7_SYNC_PROXY_PROGRAM: /usr/bin/nc
          M7_SYNC_REMOTE_DIR: /home/logreader/logs
          M7_SYNC_FULL_FILE: /home/logreader/logs/sync-full.log
          M7_SYNC_TAIL_FILE: /home/logreader/logs/sync-tail.log
          M7_SYNC_FROM_NOW_FILE: /home/logreader/logs/sync-from-now.log
          M7_SYNC_TRUNCATE_FILE: /home/logreader/logs/sync-truncate.log
          M7_SYNC_ROTATE_FILE: /home/logreader/logs/sync-rotate.log
        run: cargo test --locked --test m7_proxy_sync_live -- --ignored --test-threads=1 --nocapture

      - name: Show sshd log on failure
        if: failure()
        run: sudo cat /tmp/log-query-mcp-m7-sync/sshd.log || true
