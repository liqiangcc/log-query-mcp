name: Contracts

on:
  push:
    branches:
      - main
      - "feat/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate v1 and v2 contracts
        run: python scripts/validate_contracts.py
