name: M7 ProxyCommand

on:
  push:
    branches:
      - "feat/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/config_v2.rs"
      - "src/transport/**"
      - "tests/m7_proxy_command_live.rs"
      - ".github/workflows/m7-proxy-command.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/config_v2.rs"
      - "src/transport/**"
      - "tests/m7_proxy_command_live.rs"
      - ".github/workflows/m7-proxy-command.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-command-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenSSH and stdio proxy helper
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd
          sudo mkdir -p /run/sshd /tmp/log-query-mcp-m7-proxy
          sudo chown "$USER":"$(id -gn)" /tmp/log-query-mcp-m7-proxy
          test -x /usr/bin/nc

      - name: Prepare read-only SSH fixture
        run: |
          sudo useradd -m -s /bin/bash logreader
          echo 'logreader:test-password' | sudo chpasswd
          sudo mkdir -p /home/logreader/logs
          echo 'hello world from log-query-mcp proxy command transport' | sudo tee /home/logreader/logs/application.log >/dev/null
          sudo chown -R logreader:logreader /home/logreader/logs
          sudo chmod 444 /home/logreader/logs/application.log

          sudo ssh-keygen -q -t ed25519 -N '' -f /tmp/log-query-mcp-m7-proxy/ssh_host_ed25519_key
          sudo tee /tmp/log-query-mcp-m7-proxy/sshd_config >/dev/null <<'EOF'
          Port 2240
          ListenAddress 127.0.0.1
          HostKey /tmp/log-query-mcp-m7-proxy/ssh_host_ed25519_key
          PidFile /tmp/log-query-mcp-m7-proxy/sshd.pid
          PasswordAuthentication yes
          PubkeyAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM no
          PermitRootLogin no
          StrictModes yes
          AllowUsers logreader
          Subsystem sftp internal-sftp
          LogLevel VERBOSE
          EOF

          sudo /usr/sbin/sshd -f /tmp/log-query-mcp-m7-proxy/sshd_config -E /tmp/log-query-mcp-m7-proxy/sshd.log
          ssh-keyscan -t ed25519 -p 2240 127.0.0.1 > /tmp/log-query-mcp-m7-proxy/known_hosts

          ssh-keygen -q -t ed25519 -N '' -f /tmp/log-query-mcp-m7-proxy/wrong_host_key
          WRONG_KEY=$(cut -d' ' -f1,2 /tmp/log-query-mcp-m7-proxy/wrong_host_key.pub)
          printf '[127.0.0.1]:2240 %s\n' "$WRONG_KEY" > /tmp/log-query-mcp-m7-proxy/bad_known_hosts

      - name: Check M7 code and tests
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features

      - name: Verify ProxyCommand through real OpenSSH and SFTP
        env:
          M2_SSH_PORT: "2240"
          M2_SSH_PASSWORD: test-password
          M2_KNOWN_HOSTS: /tmp/log-query-mcp-m7-proxy/known_hosts
          M2_BAD_KNOWN_HOSTS: /tmp/log-query-mcp-m7-proxy/bad_known_hosts
          M2_REMOTE_DIR: /home/logreader/logs
          M2_REMOTE_FILE: /home/logreader/logs/application.log
          M7_PROXY_PROGRAM: /usr/bin/nc
        run: cargo test --locked --test m7_proxy_command_live -- --ignored --test-threads=1 --nocapture

      - name: Show sshd log on failure
        if: failure()
        run: sudo cat /tmp/log-query-mcp-m7-proxy/sshd.log || true
