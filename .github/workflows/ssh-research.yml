name: SSH Transport

on:
  push:
    branches:
      - "docs/remote-ssh-cache-design-v2"
      - "feat/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/secret.rs"
      - "src/transport/**"
      - "tests/ssh_transport_live.rs"
      - "research/ssh-sftp-poc/**"
      - ".github/workflows/ssh-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-sftp-transport:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenSSH test server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd
          sudo mkdir -p /run/sshd /tmp/log-query-mcp-ssh-poc
          sudo chown "$USER":"$(id -gn)" /tmp/log-query-mcp-ssh-poc

      - name: Prepare SSH user and fixtures
        run: |
          sudo useradd -m -s /bin/bash logreader
          echo 'logreader:test-password' | sudo chpasswd
          sudo mkdir -p /home/logreader/.ssh /home/logreader/logs
          echo 'hello world from log-query-mcp ssh transport' | sudo tee /home/logreader/logs/application.log >/dev/null
          echo 'denied' | sudo tee /home/logreader/logs/denied.log >/dev/null
          sudo mkfifo /home/logreader/logs/blocking.pipe
          sudo chown -R logreader:logreader /home/logreader/.ssh
          sudo chown -R logreader:logreader /home/logreader/logs
          sudo chown root:root /home/logreader/logs/denied.log
          sudo chmod 700 /home/logreader/.ssh
          sudo chmod 444 /home/logreader/logs/application.log
          sudo chmod 000 /home/logreader/logs/denied.log

          ssh-keygen -q -t ed25519 -N 'test-passphrase' -f /tmp/log-query-mcp-ssh-poc/client_key
          sudo cp /tmp/log-query-mcp-ssh-poc/client_key.pub /home/logreader/.ssh/authorized_keys
          sudo chown logreader:logreader /home/logreader/.ssh/authorized_keys
          sudo chmod 600 /home/logreader/.ssh/authorized_keys

          sudo ssh-keygen -q -t ed25519 -N '' -f /tmp/log-query-mcp-ssh-poc/ssh_host_ed25519_key
          sudo tee /tmp/log-query-mcp-ssh-poc/sshd_config >/dev/null <<'EOF'
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /tmp/log-query-mcp-ssh-poc/ssh_host_ed25519_key
          PidFile /tmp/log-query-mcp-ssh-poc/sshd.pid
          PasswordAuthentication yes
          PubkeyAuthentication yes
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM no
          PermitRootLogin no
          StrictModes yes
          AllowUsers logreader
          AuthorizedKeysFile .ssh/authorized_keys
          Subsystem sftp internal-sftp
          LogLevel VERBOSE
          EOF

          sudo /usr/sbin/sshd -f /tmp/log-query-mcp-ssh-poc/sshd_config -E /tmp/log-query-mcp-ssh-poc/sshd.log
          ssh-keyscan -p 2222 127.0.0.1 > /tmp/log-query-mcp-ssh-poc/known_hosts

          ssh-keygen -q -t ed25519 -N '' -f /tmp/log-query-mcp-ssh-poc/wrong_host_key
          WRONG_KEY=$(cut -d' ' -f1,2 /tmp/log-query-mcp-ssh-poc/wrong_host_key.pub)
          printf '[127.0.0.1]:2222 %s\n' "$WRONG_KEY" > /tmp/log-query-mcp-ssh-poc/bad_known_hosts

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: m2-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

      - name: Check production transport
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --all-features

      - name: Verify production SSH/SFTP transport
        env:
          M2_SSH_PORT: "2222"
          M2_STALL_PORT: "2223"
          M2_SSH_PASSWORD: test-password
          M2_WRONG_PASSWORD: definitely-wrong
          M2_KEY_PASSPHRASE: test-passphrase
          M2_SSH_KEY_FILE: /tmp/log-query-mcp-ssh-poc/client_key
          M2_KNOWN_HOSTS: /tmp/log-query-mcp-ssh-poc/known_hosts
          M2_BAD_KNOWN_HOSTS: /tmp/log-query-mcp-ssh-poc/bad_known_hosts
          M2_REMOTE_DIR: /home/logreader/logs
          M2_REMOTE_FILE: /home/logreader/logs/application.log
          M2_DENIED_FILE: /home/logreader/logs/denied.log
          M2_FIFO_FILE: /home/logreader/logs/blocking.pipe
        run: |
          nc -l 127.0.0.1 2223 >/dev/null 2>&1 &
          NC_PID=$!
          trap 'kill "$NC_PID" 2>/dev/null || true' EXIT
          cargo test --test ssh_transport_live -- --ignored --test-threads=1

      - name: Check research POC remains compatible
        run: cargo check --manifest-path research/ssh-sftp-poc/Cargo.toml

      - name: Show sshd log on failure
        if: failure()
        run: sudo cat /tmp/log-query-mcp-ssh-poc/sshd.log || true
