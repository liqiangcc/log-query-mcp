name: M4 Continuity Hardening Once

on:
  push:
    branches:
      - "feat/v2-m1-backend-config"
    paths:
      - ".github/workflows/m4-continuity-hardening-once.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/feat/v2-m1-backend-config'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-m1-backend-config

      - name: Apply and verify continuity hardening
        run: |
          python .github/scripts/m4_same_size_fingerprint_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo test --locked cache::sync::tests::
          git diff --check
          CHANGED=$(git diff --name-only | grep -Ev '^src/cache/sync.rs$' || true)
          test -z "$CHANGED"

      - name: Commit verified continuity hardening
        run: |
          git add -- src/cache/sync.rs
          test "$(git diff --cached --name-only)" = "src/cache/sync.rs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cache): verify continuity before unchanged sync'
          git push origin HEAD:feat/v2-m1-backend-config

# Rerun marker: isolated after live test rustfmt cleanup.
