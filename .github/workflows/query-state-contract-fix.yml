name: Query State Contract Fix

on:
  push:
    branches:
      - feat/query-orchestration-time-filter

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show

      - name: Align empty half-open range semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in (Path("src/time_filter.rs"), Path("src/query_state.rs")):
              text = path.read_text()
              text = text.replace(
                  '.is_some_and(|(start, end)| start >= end)',
                  '.is_some_and(|(start, end)| start > end)',
              )
              text = text.replace(
                  '"start_time must be earlier than end_time"',
                  '"start_time must not be later than end_time"',
              )
              path.write_text(text)

          path = Path("src/time_filter.rs")
          text = path.read_text()
          marker = 'fn rejects_reverse_or_equal_range()'
          index = text.index(marker)
          prefix, suffix = text[:index], text[index:]
          suffix = suffix.replace(
              'fn rejects_reverse_or_equal_range()',
              'fn rejects_reverse_range()',
              1,
          )
          suffix = suffix.replace(
              'Some("2026-06-19T15:00:00+09:00"),',
              'Some("2026-06-19T15:00:01+09:00"),',
              1,
          )
          path.write_text(prefix + suffix)
          PY
          cargo fmt --all

      - name: Validate
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/query-state-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/query-state-contract-fix.yml
          git commit -m "fix: allow empty half-open query time ranges"
          git push origin "HEAD:${GITHUB_REF_NAME}"
