name: M5 Coverage Error Once

on:
  push:
    branches:
      - "feat/v2-m1-backend-config"
    paths:
      - ".github/workflows/m5-coverage-error-once.yml"
      - ".github/scripts/m5_coverage_error_patch.py"

permissions:
  contents: write

jobs:
  implement:
    if: github.ref == 'refs/heads/feat/v2-m1-backend-config'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-m1-backend-config

      - name: Apply and verify coverage and v2 errors
        run: |
          python .github/scripts/m5_coverage_error_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          git diff --check
          CHANGED=$(git diff --name-only | grep -Ev '^(src/source_registry.rs|src/query_engine.rs|src/stateful_query.rs|src/tool_error.rs)$' || true)
          test -z "$CHANGED"

      - name: Commit verified coverage and v2 errors
        run: |
          git add -- src/source_registry.rs src/query_engine.rs src/stateful_query.rs src/tool_error.rs
          CHANGED=$(git diff --cached --name-only | grep -Ev '^(src/source_registry.rs|src/query_engine.rs|src/stateful_query.rs|src/tool_error.rs)$' || true)
          test -z "$CHANGED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(remote): enforce cache coverage and v2 error codes'
          git push origin HEAD:feat/v2-m1-backend-config
