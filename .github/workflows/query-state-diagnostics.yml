name: Query State Diagnostics

on:
  push:
    branches:
      - feat/query-orchestration-time-filter

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Capture diagnostics
        shell: bash
        run: |
          mkdir -p research
          cargo generate-lockfile
          cargo fmt --all
          set +e
          cargo clippy --locked --all-targets --all-features --message-format=short -- -D warnings > research/query-state-clippy.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > research/query-state-clippy-status.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          git rm .github/workflows/query-state-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src research/query-state-clippy.txt research/query-state-clippy-status.txt .github/workflows/query-state-diagnostics.yml
          git commit -m "ci: capture query state Clippy diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
