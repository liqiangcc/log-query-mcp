name: M3 Append Once

on:
  push:
    branches:
      - "feat/v2-m1-backend-config"
    paths:
      - ".github/workflows/m3-append-once.yml"

permissions:
  contents: write

jobs:
  implement:
    if: github.ref == 'refs/heads/feat/v2-m1-backend-config'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-m1-backend-config

      - name: Apply and verify append semantics
        run: |
          python .github/scripts/m3_append_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo test --locked cache::
          git diff --check
          CHANGED=$(git diff --name-only | grep -Ev '^(src/cache/store.rs|src/cache/mod.rs|src/lib.rs)$' || true)
          test -z "$CHANGED"

      - name: Commit verified append semantics
        run: |
          git add -- src/cache/store.rs src/cache/mod.rs src/lib.rs
          CHANGED=$(git diff --cached --name-only | grep -Ev '^(src/cache/store.rs|src/cache/mod.rs|src/lib.rs)$' || true)
          test -z "$CHANGED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cache): preserve generation across append'
          git push origin HEAD:feat/v2-m1-backend-config
