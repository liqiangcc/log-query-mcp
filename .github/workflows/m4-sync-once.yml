name: M4 Sync Once

on:
  push:
    branches:
      - "feat/v2-m1-backend-config"
    paths:
      - ".github/workflows/m4-sync-once.yml"
      - ".github/scripts/m4_sync_wire.py"

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/feat/v2-m1-backend-config'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-m1-backend-config

      - name: Wire M4 and verify
        run: |
          python .github/scripts/m4_sync_wire.py
          cargo fmt --all
          cargo check --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked cache::sync::
          git diff --check
          CHANGED=$(git diff --name-only | grep -Ev '^(Cargo.toml|Cargo.lock|src/cache/sync.rs|src/cache/mod.rs|src/lib.rs)$' || true)
          test -z "$CHANGED"

      - name: Commit verified M4 wiring
        run: |
          git add -- Cargo.toml Cargo.lock src/cache/sync.rs src/cache/mod.rs src/lib.rs
          CHANGED=$(git diff --cached --name-only | grep -Ev '^(Cargo.toml|Cargo.lock|src/cache/sync.rs|src/cache/mod.rs|src/lib.rs)$' || true)
          test -z "$CHANGED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cache): wire M4 sync engine'
          git push origin HEAD:feat/v2-m1-backend-config
