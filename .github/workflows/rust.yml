name: Query State Finalize

on:
  push:
    branches:
      - feat/query-orchestration-time-filter

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Apply final source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/stateful_query.rs")
          text = path.read_text()
          old = "        let mut limits = LimitsConfig::default();\n        limits.max_scan_bytes_per_page = 20;"
          new = "        let limits = LimitsConfig {\n            max_scan_bytes_per_page: 20,\n            ..LimitsConfig::default()\n        };"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("expected LimitsConfig test snippet was not found")
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Restore strict workflow and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          Path(".github/workflows/rust.yml").write_text(dedent("""\
          name: Rust

          on:
            push:
              branches:
                - main
                - "feat/**"
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install Rust toolchain
                  run: rustup show

                - name: Check formatting
                  run: cargo fmt --all -- --check

                - name: Run Clippy
                  run: cargo clippy --locked --all-targets --all-features -- -D warnings

                - name: Run tests
                  run: cargo test --locked --all-targets --all-features
          """))
          PY
          rm -f .github/workflows/query-state-fix.yml
          rm -f research/query-state-clippy*.txt research/query-state-postfix-*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize stateful query validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
