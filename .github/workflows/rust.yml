name: Rust

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show

      - name: Normalize sources and lockfile
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Commit generated changes on branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          if test -n "$(git status --porcelain -- Cargo.lock src tests)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock src tests
            git commit -m "style: normalize bounded scanner implementation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
