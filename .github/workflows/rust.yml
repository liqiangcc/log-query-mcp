name: Rust

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Generate lockfile and format
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Commit generated changes on branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          if test -n "$(git status --porcelain -- Cargo.lock src)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock src
            git commit -m "style: normalize query orchestration implementation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
