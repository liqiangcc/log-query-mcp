name: Rust

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Capture compiler diagnostics
        shell: bash
        run: |
          cargo generate-lockfile
          cargo fmt --all
          mkdir -p research
          set +e
          cargo clippy --locked --all-targets --all-features --message-format=short -- -D warnings > research/query-clippy-diagnostics.txt 2>&1
          clippy_status=$?
          cargo test --locked --all-targets --all-features > research/query-test-diagnostics.txt 2>&1
          test_status=$?
          set -e
          echo "$clippy_status" > research/query-clippy-status.txt
          echo "$test_status" > research/query-test-status.txt

      - name: Commit diagnostics on branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          if test -n "$(git status --porcelain -- Cargo.lock src research/query-*-diagnostics.txt research/query-*-status.txt)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock src research/query-*-diagnostics.txt research/query-*-status.txt
            git commit -m "ci: capture query orchestration diagnostics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Enforce Clippy result
        run: test "$(cat research/query-clippy-status.txt)" -eq 0

      - name: Enforce test result
        run: test "$(cat research/query-test-status.txt)" -eq 0
