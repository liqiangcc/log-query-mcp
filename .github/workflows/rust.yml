name: Rust

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Normalize source registry sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/source_discovery.rs")
          text = path.read_text()
          text = text.replace(
              'rule(".", false, &["application.log"]),',
              'rule(".", false, &[".log"]),',
          )
          path.write_text(text)
          PY
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit normalization and lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if test -n "$(git status --porcelain -- src Cargo.lock)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src Cargo.lock
            git commit -m "style: normalize source registry implementation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
