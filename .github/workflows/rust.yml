name: Rust

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy and capture diagnostics
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features --message-format=short -- -D warnings 2>&1 | tee clippy-diagnostics.txt

      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-registry-clippy
          path: clippy-diagnostics.txt
          if-no-files-found: error

      - name: Enforce Clippy result
        if: always()
        run: test "${{ steps.clippy.outcome }}" = "success"

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
