name: Context Reader Fixup

on:
  push:
    branches:
      - feat/context-reader

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Repair test typo and apply machine fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/context_reader.rs")
          text = path.read_text()
          text = text.replace(
              "let mut reference = reference(3, 8, 8);\n        stale_reference.file_size_at_match = data.len() as u64;",
              "let mut reference = reference(3, 8, 8);\n        reference.file_size_at_match = data.len() as u64;",
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --fix --allow-dirty --allow-staged --locked --all-targets --all-features -- -D warnings
          cargo fmt --all

      - name: Run strict validation
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Remove fixup workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/context-reader-fixup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/context-reader-fixup.yml
          git commit -m "fix: validate bounded context reader"
          git push origin "HEAD:${GITHUB_REF_NAME}"
