name: Context Reader Fixup

on:
  push:
    branches:
      - feat/context-reader

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Repair test typo and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/context_reader.rs")
          text = path.read_text()
          old = "let mut reference = reference(3, 8, 8);\n        stale_reference.file_size_at_match = data.len() as u64;"
          new = "let mut reference = reference(3, 8, 8);\n        reference.file_size_at_match = data.len() as u64;"
          if old not in text:
              raise SystemExit("expected context reader typo not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit deterministic fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/context-reader-fixup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context_reader.rs .github/workflows/context-reader-fixup.yml
          git commit -m "fix: repair context reader test setup"
          git push origin "HEAD:${GITHUB_REF_NAME}"
