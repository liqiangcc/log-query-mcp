name: M3 Format Once

on:
  push:
    branches:
      - "feat/v2-m1-backend-config"
    paths:
      - "src/cache/**"
      - "src/lib.rs"
      - ".github/workflows/m3-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/v2-m1-backend-config'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-m1-backend-config

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit only M3 formatting
        run: |
          OTHER_CHANGES=$(git status --short | awk '$2 !~ /^src\/cache\// && $2 != "src/lib.rs" {print}')
          test -z "$OTHER_CHANGES"
          git add -- src/cache src/lib.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | grep -Ev '^(src/cache/|src/lib.rs$)' || true)
          test -z "$CHANGED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(cache): apply rustfmt'
          git push origin HEAD:feat/v2-m1-backend-config
