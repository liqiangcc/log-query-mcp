name: Context Reader Bootstrap

on:
  push:
    branches:
      - feat/context-reader

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Format sources
        run: cargo fmt --all

      - name: Commit formatting and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/context-reader-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/context-reader-bootstrap.yml
          git commit -m "style: format context reader implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
