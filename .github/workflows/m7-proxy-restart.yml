name: M7 Proxy Restart

on:
  push:
    branches:
      - "feat/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/m7_proxy_restart_live.rs"
      - ".github/workflows/m7-proxy-restart.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/m7_proxy_restart_live.rs"
      - ".github/workflows/m7-proxy-restart.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-restart-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenSSH and stdio proxy helper
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd
          sudo mkdir -p /run/sshd /tmp/log-query-mcp-m7-restart
          sudo chown "$USER":"$(id -gn)" /tmp/log-query-mcp-m7-restart
          test -x /usr/bin/nc

      - name: Prepare restart fixture
        run: |
          sudo useradd -m -s /bin/bash logreader
          echo 'logreader:test-password' | sudo chpasswd
          sudo mkdir -p /home/logreader/logs
          printf 'M7_RESTART_BASE before-restart\n' | sudo tee /home/logreader/logs/proxy-restart.log >/dev/null
          sudo chown -R logreader:logreader /home/logreader/logs
          sudo chmod 666 /home/logreader/logs/proxy-restart.log

          sudo ssh-keygen -q -t ed25519 -N '' -f /tmp/log-query-mcp-m7-restart/ssh_host_ed25519_key
          sudo tee /tmp/log-query-mcp-m7-restart/sshd_config >/dev/null <<'EOF'
          Port 2240
          ListenAddress 127.0.0.1
          HostKey /tmp/log-query-mcp-m7-restart/ssh_host_ed25519_key
          PidFile /tmp/log-query-mcp-m7-restart/sshd.pid
          PasswordAuthentication yes
          PubkeyAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM no
          PermitRootLogin no
          StrictModes yes
          AllowUsers logreader
          Subsystem sftp internal-sftp
          LogLevel VERBOSE
          EOF

          sudo /usr/sbin/sshd -f /tmp/log-query-mcp-m7-restart/sshd_config -E /tmp/log-query-mcp-m7-restart/sshd.log
          ssh-keyscan -t ed25519 -p 2240 127.0.0.1 > /tmp/log-query-mcp-m7-restart/known_hosts

      - name: Check M7 restart code
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features

      - name: Verify ProxyCommand restart recovery and stale-cache fail-closed behavior
        env: &restart_env
          M7_RESTART_SSH_PORT: "2240"
          M7_RESTART_SSH_PASSWORD: test-password
          M7_RESTART_KNOWN_HOSTS: /tmp/log-query-mcp-m7-restart/known_hosts
          M7_RESTART_REMOTE_DIR: /home/logreader/logs
          M7_RESTART_CACHE_ROOT: /tmp/log-query-mcp-m7-restart/cache
          M7_RESTART_PROXY_PROGRAM: /usr/bin/nc
        run: |
          rm -rf "$M7_RESTART_CACHE_ROOT"
          cargo test --locked --test m7_proxy_restart_live bootstrap_cache_through_proxy_before_server_restart -- --ignored --exact --test-threads=1 --nocapture

          SSHD_PID=$(sudo cat /tmp/log-query-mcp-m7-restart/sshd.pid)
          sudo kill "$SSHD_PID"
          for _ in $(seq 1 50); do
            if ! nc -z 127.0.0.1 2240; then
              break
            fi
            sleep 0.1
          done
          if nc -z 127.0.0.1 2240; then
            echo "M7 restart fixture did not stop" >&2
            exit 1
          fi

          printf 'M7_RESTART_AFTER after-restart\n' | sudo tee -a /home/logreader/logs/proxy-restart.log >/dev/null

          cargo test --locked --test m7_proxy_restart_live proxy_server_outage_fails_closed_without_serving_stale_cache -- --ignored --exact --test-threads=1 --nocapture

          sudo /usr/sbin/sshd -f /tmp/log-query-mcp-m7-restart/sshd_config -E /tmp/log-query-mcp-m7-restart/sshd.log
          for _ in $(seq 1 50); do
            if nc -z 127.0.0.1 2240; then
              break
            fi
            sleep 0.1
          done
          if ! nc -z 127.0.0.1 2240; then
            echo "M7 restart fixture did not restart" >&2
            exit 1
          fi

          cargo test --locked --test m7_proxy_restart_live proxy_query_recovers_after_server_restart_and_append -- --ignored --exact --test-threads=1 --nocapture

      - name: Show sshd log on failure
        if: failure()
        run: sudo cat /tmp/log-query-mcp-m7-restart/sshd.log || true
