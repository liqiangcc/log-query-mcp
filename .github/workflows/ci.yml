name: CI

on:
  push:
    branches:
      - main
      - "spike/**"
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Format research sources
        run: cargo fmt --all

      - name: Restore strict workflow and commit formatting
        if: github.event_name == 'push'
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches:
                - main
                - "spike/**"
            pull_request:

          permissions:
            contents: read

          jobs:
            rust:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install Rust toolchain
                  run: rustup show

                - name: Check formatting
                  run: cargo fmt --all -- --check

                - name: Run Clippy
                  run: cargo clippy --all-targets --all-features -- -D warnings

                - name: Run tests
                  run: cargo test --all-targets --all-features
          YAML
          if ! git diff --quiet -- src .github/workflows/ci.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src .github/workflows/ci.yml
            git commit -m "style: apply rustfmt and restore strict CI"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features
