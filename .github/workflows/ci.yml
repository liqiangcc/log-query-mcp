name: CI

on:
  push:
    branches:
      - "spike/**"
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Format research sources
        run: cargo fmt --all

      - name: Commit formatted sources on research branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/spike/technical-research'
        shell: bash
        run: |
          if git diff --quiet -- src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply rustfmt to directory source support"
          git push origin HEAD:spike/technical-research

      - name: Run Clippy and capture diagnostics
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      - name: Run tests and capture diagnostics
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets --all-features 2>&1 | tee tests.log

      - name: Run scanner benchmark smoke test
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          python3 research/scripts/generate_benchmark_log.py \
            --output /tmp/log-query-benchmark-smoke.log \
            --size-mib 1 \
            --keyword BENCHMARK_MATCH \
            --match-every 1000 \
            | tee benchmark-generator.log
          cargo run --quiet --bin log-query-benchmark -- \
            /tmp/log-query-benchmark-smoke.log \
            __NO_MATCH__ \
            1 \
            | tee benchmark-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("benchmark-smoke.json").read_text())
          assert report["file_bytes"] == 1024 * 1024
          assert report["total_bytes_scanned"] == 1024 * 1024
          assert report["total_results"] == 0
          assert report["last_stop_reason"] == "Complete"
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-integration-diagnostics
          path: |
            clippy.log
            tests.log
            benchmark-generator.log
            benchmark-smoke.json
          if-no-files-found: warn

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          test "${{ steps.clippy.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.benchmark.outcome }}" = "success"
