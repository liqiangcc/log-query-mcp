name: CI

on:
  push:
    branches:
      - "spike/**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: spike/technical-research

      - name: Install Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy and capture diagnostics
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      - name: Run tests and capture diagnostics
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets --all-features 2>&1 | tee tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-integration-diagnostics
          path: |
            clippy.log
            tests.log
          if-no-files-found: warn

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          test "${{ steps.clippy.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
