name: CI

on:
  push:
    branches:
      - main
      - "spike/**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Format working tree for research validation
        run: cargo fmt --all

      - name: Run Clippy and capture diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy.log 2>&1
          echo "$?" > clippy.status
          exit 0

      - name: Run tests and capture diagnostics
        shell: bash
        run: |
          set +e
          cargo test --all-targets --all-features > test.log 2>&1
          echo "$?" > test.status
          exit 0

      - name: Upload research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-r04-diagnostics
          path: |
            src
            clippy.log
            clippy.status
            test.log
            test.status
          if-no-files-found: error

      - name: Enforce compiler and test results
        shell: bash
        run: |
          test "$(cat clippy.status)" -eq 0
          test "$(cat test.status)" -eq 0
