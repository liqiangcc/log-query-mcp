name: CI

on:
  push:
    branches:
      - main
      - "spike/**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests and capture diagnostics
        shell: bash
        run: |
          set +e
          cargo test --all-targets --all-features > test.log 2>&1
          echo "$?" > test.status
          exit 0

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r08-test-diagnostics
          path: |
            test.log
            test.status
          if-no-files-found: error

      - name: Enforce test result
        run: test "$(cat test.status)" -eq 0
