name: CI

on:
  push:
    branches:
      - main
      - "spike/**"
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Normalize R-08 continuation errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/search_cursor.rs")
          text = path.read_text()
          old = "        next.validate()?;\n"
          new = '''        next.validate().map_err(|_| {
              SearchCursorError::InvalidContinuation("continuation state is invalid")
          })?;
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Format R-08 research sources
        run: cargo fmt --all

      - name: Commit normalized sources on branch pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "fix: normalize R-08 cursor continuation handling"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features
