name: CI

on:
  push:
    branches:
      - main
      - "spike/**"
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Apply R-07 Clippy fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/match_reference.rs")
          text = path.read_text()
          old = '''        loop {
              let Some(token) = self.order.front() else {
                  break;
              };

              match self.entries.get(token) {
                  Some(entry) if entry.expires_at <= now => {
                      let token = self.order.pop_front().expect("front token exists");
                      self.entries.remove(&token);
                  }
                  None => {
                      self.order.pop_front();
                  }
                  Some(_) => break,
              }
          }
          '''
          new = '''        while let Some(token) = self.order.front().cloned() {
              match self.entries.get(&token) {
                  Some(entry) if entry.expires_at <= now => {
                      self.order.pop_front();
                      self.entries.remove(&token);
                  }
                  None => {
                      self.order.pop_front();
                  }
                  Some(_) => break,
              }
          }
          '''
          if old not in text:
              raise SystemExit("expected purge_expired loop was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit source fix on branch pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "fix: satisfy Clippy in match reference store"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features
