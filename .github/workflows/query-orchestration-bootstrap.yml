name: Query Orchestration Bootstrap

on:
  push:
    branches:
      - feat/query-orchestration

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Wire modules and dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text()
          if 'chrono = ' not in cargo_text:
              cargo_text = cargo_text.replace(
                  '[dependencies]\n',
                  '[dependencies]\nchrono = { version = "0.4", default-features = false, features = ["std"] }\n',
                  1,
              )
          cargo.write_text(cargo_text)

          lib = Path("src/lib.rs")
          lib_text = lib.read_text()
          if 'mod query_engine;' not in lib_text:
              lib_text = lib_text.replace(
                  'pub mod config;\n',
                  'pub mod config;\nmod query_engine;\n',
                  1,
              )
          if 'mod time_filter;' not in lib_text:
              lib_text = lib_text.replace(
                  'mod scanner;\n',
                  'mod scanner;\nmod time_filter;\n',
                  1,
              )
          if 'pub use query_engine::' not in lib_text:
              marker = 'pub use scan_executor::'
              export = '''pub use query_engine::{
              QueryCandidateSnapshot, QueryContinuation, QueryEngine, QueryError, QueryMatch,
              QueryPage, QueryPageStopReason, QueryPageSummary, SearchQuery,
          };
          '''
              lib_text = lib_text.replace(marker, export + marker, 1)
          if 'pub use time_filter::' not in lib_text:
              marker = '#[cfg(target_os = "linux")]\npub use safe_fs::'
              export = '''pub use time_filter::{
              MAX_QUERY_TIME_CHARS, TimeFilterError, TimeRange, TimestampParser,
          };
          
          '''
              lib_text = lib_text.replace(marker, export + marker, 1)
          lib.write_text(lib_text)

          query = Path("src/query_engine.rs")
          query_text = query.read_text()
          query_text = query_text.replace(
              '''continuation = Some(QueryContinuation {
                              candidates: candidates.clone(),
                              next_candidate_index: candidate_index,
                              next_position: ScanPosition::default(),
                          });''',
              '''continuation = Some(build_continuation(
                              &candidates,
                              candidate_index,
                              ScanPosition::default(),
                          ));''',
          )
          query_text = query_text.replace(
              '''continuation = Some(QueryContinuation {
                              candidates: candidates.clone(),
                              next_candidate_index: candidate_index,
                              next_position: position,
                          });''',
              '''continuation = Some(build_continuation(
                              &candidates,
                              candidate_index,
                              position,
                          ));''',
          )
          query_text = query_text.replace(
              '''continuation = outcome.next_position.map(|next_position| {
                                  QueryContinuation {
                                      candidates: candidates.clone(),
                                      next_candidate_index: candidate_index,
                                      next_position,
                                  }
                              });''',
              '''continuation = outcome.next_position.map(|next_position| {
                                  build_continuation(&candidates, candidate_index, next_position)
                              });''',
          )
          helper_marker = '#[derive(Debug)]\nstruct RankedMatch'
          if 'fn build_continuation(' not in query_text:
              helper = '''fn build_continuation(
              candidates: &[QueryCandidate],
              next_candidate_index: usize,
              next_position: ScanPosition,
          ) -> QueryContinuation {
              QueryContinuation {
                  candidates: candidates
                      .iter()
                      .map(|candidate| QueryCandidateSnapshot {
                          source_order: candidate.source_order,
                          file_order: candidate.file_order,
                          source_id: candidate.source_id.clone(),
                          file: candidate.file.clone(),
                      })
                      .collect(),
                  next_candidate_index,
                  next_position,
              }
          }
          
          '''
              query_text = query_text.replace(helper_marker, helper + helper_marker, 1)
          query.write_text(query_text)
          PY

          cargo fmt --all
          cargo generate-lockfile

      - name: Remove bootstrap workflow and commit generated changes
        shell: bash
        run: |
          git rm .github/workflows/query-orchestration-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src .github/workflows/query-orchestration-bootstrap.yml
          git commit -m "build: wire query orchestration modules"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run strict validation
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
