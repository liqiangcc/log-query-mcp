name: Release

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show

      - name: Install release target
        run: rustup target add "${TARGET}"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: bash scripts/check_release_tag.sh "${GITHUB_REF_NAME}"

      - name: Build release binaries
        run: cargo build --release --locked --bins --target "${TARGET}"

      - name: Run transport smoke tests
        run: cargo test --locked --test mcp_transport_smoke -- --nocapture

      - name: Exercise upgrade and rollback
        run: bash tests/upgrade_rollback_test.sh

      - name: Assemble release package
        run: |
          args=(--target "${TARGET}" --out-dir dist --require-docs)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          bash scripts/package_release.sh "${args[@]}"

      - name: Validate release package
        run: |
          archive="$(find dist -maxdepth 1 -type f -name 'log-query-mcp-v*.tar.gz' -print -quit)"
          [[ -n "${archive}" ]]
          bash scripts/validate_release_package.sh "${archive}" dist/SHA256SUMS

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: log-query-mcp-release-${{ github.run_id }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: log-query-mcp-release-${{ github.run_id }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: x86_64-unknown-linux-gnu
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/log-query-mcp-v${version}-${TARGET}.tar.gz"
          test -f "${archive}"
          test -f dist/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" "${archive}" dist/SHA256SUMS \
            --verify-tag \
            --title "log-query-mcp ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
