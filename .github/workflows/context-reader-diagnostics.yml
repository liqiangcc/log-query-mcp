name: Context Reader Diagnostics

on:
  push:
    branches:
      - feat/context-reader

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Capture diagnostics
        shell: bash
        run: |
          mkdir -p research
          cargo fmt --all
          set +e
          cargo clippy --locked --all-targets --all-features --message-format=short -- -D warnings > research/context-reader-clippy.txt 2>&1
          status=$?
          echo "$status" > research/context-reader-clippy-status.txt
          set -e

      - name: Commit diagnostics and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/context-reader-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src research/context-reader-clippy.txt research/context-reader-clippy-status.txt .github/workflows/context-reader-diagnostics.yml
          git commit -m "ci: record context reader Clippy diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
